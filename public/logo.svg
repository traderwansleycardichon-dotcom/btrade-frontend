<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500" width="1500" height="1500" role="img" aria-label="Behind the Trades — Journal">
  <!-- Fond cercle orange -->
  <circle cx="750" cy="750" r="750" fill="#F36C00"/>

  <g font-family="'Arial Black', 'Helvetica Black', Impact, sans-serif" font-weight="900">
    <!-- "Behind" -->
    <text x="750" y="595"
          font-size="270"
          fill="#0A0B0E"
          text-anchor="middle"
          letter-spacing="-8">Behind</text>

    <!-- "the" pill -->
    <g transform="translate(395 678) rotate(-4)">
      <rect x="0" y="0" width="320" height="148" rx="74" ry="74" fill="#FFFFFF"/>
      <text x="160" y="115"
            font-size="118"
            font-style="italic"
            fill="#F36C00"
            text-anchor="middle"
            letter-spacing="-3">the</text>
    </g>

    <!-- "trades" -->
    <text x="780" y="935"
          font-size="270"
          fill="#0A0B0E"
          text-anchor="middle"
          letter-spacing="-8">trades</text>

    <!-- "journal" (remplace "podcast") -->
    <text x="1170" y="1055"
          font-size="105"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="-3">journal</text>
  </g>
</svg>
